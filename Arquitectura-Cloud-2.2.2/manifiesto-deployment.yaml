apiVersion: apps/v1
kind: Deployment
metadata:
  name: get-products
  namespace: escolaronline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: get-products
  template:
    metadata:
      labels:
        app: get-products
    spec:
      containers:
      - name: get-products
        image: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/escolaronline-get-products:latest
        ports:
        - containerPort: 3001
        env:
        - name: DB_HOST
          value: "<RDS_ENDPOINT>"
        - name: DB_USER
          value: "alumno"
        - name: DB_PASS
          value: "alumno123"
        - name: DB_NAME
          value: "escolar_online"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi